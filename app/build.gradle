plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.cartographer.demo'
    compileSdk 34
    defaultConfig {
        applicationId 'com.cartographer.demo'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets {
        main {
            manifest.srcFile '../main/AndroidManifest.xml'
            java.srcDirs = ['../main/java']
            res.srcDirs = ['../main/res']
            assets.srcDirs = ['../main/assets']
            jniLibs.srcDirs = ['../main/jniLibs']
        }
        test.java.srcDirs = ['../test/java']
        androidTest.java.srcDirs = ['../androidTest/java']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.github.mik3y:usb-serial-for-android:3.4.6'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
}
